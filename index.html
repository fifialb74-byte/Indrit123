<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18+ Verification</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

/* Age box */
#ageBox{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

button{
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:8px;
  font-size:16px;
}

/* Main content */
#content{
  display:none;
  padding-top:50px;
}

img{
  width:90%;
  border-radius:12px;
}

/* Hold button */
#holdBtn{
  margin-top:20px;
  background:red;
  color:white;
}

/* Fake menu */
#menu{
  display:none;
  position:fixed;
  bottom:0;
  width:100%;
  background:#222;
  padding:20px;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
}

.menuBtn{
  width:90%;
  margin:10px auto;
  display:block;
  background:#444;
  color:white;
}
</style>
</head>

<body>

<!-- AGE VERIFY -->
<div id="ageBox">
  <h2>Are you 18+?</h2>
  <button onclick="enter()">Yes</button>
  <button onclick="alert('Access denied')">No</button>
</div>

<!-- CONTENT -->
<div id="content">
  <img src="https://via.placeholder.com/400x300" alt="image">
  <br>
  <button id="holdBtn">Hold 2 seconds</button>
</div>

<!-- MENU -->
<div id="menu">
  <h3>Open with</h3>
  <button class="menuBtn" onclick="go('https://www.google.com')">Google</button>
  <button class="menuBtn" onclick="go('https://www.google.com')">Browser</button>
</div>

<script>
// Age
function enter(){
  document.getElementById("ageBox").style.display="none";
  document.getElementById("content").style.display="block";
}

// Hold logic
let timer;

let btn = document.getElementById("holdBtn");

btn.addEventListener("touchstart", start);
btn.addEventListener("mousedown", start);

btn.addEventListener("touchend", cancel);
btn.addEventListener("mouseup", cancel);

function start(){
  timer = setTimeout(()=>{
    document.getElementById("menu").style.display="block";
  },2000);
}

function cancel(){
  clearTimeout(timer);
}

// redirect
function go(link){
  window.location.href = link;
}
</script>

</body>
</html>
