<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:black;
  font-family:Arial;
  overflow:hidden;
}

/* VIDEO PLAYER FAKE */
.player{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url("https://i.imgur.com/CqtgSA5.jpeg") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* PLAY ICON */
.play{
  width:90px;
  height:90px;
  background:rgba(0,0,0,0.6);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  color:white;
}

/* HOLD BUTTON */
.btn{
  position:absolute;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  background:#ff1a1a;
  color:white;
  padding:22px 35px;
  font-size:24px;
  font-weight:bold;
  border-radius:20px;
  text-decoration:none;
  box-shadow:0 0 20px red;
  animation:shake 0.6s infinite;
}

/* SHAKE */
@keyframes shake{
  0%{transform:translate(-50%,0)}
  25%{transform:translate(-53%,0)}
  50%{transform:translate(-47%,0)}
  75%{transform:translate(-53%,0)}
  100%{transform:translate(-50%,0)}
}

/* POPUP 18+ */
#popup{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  text-align:center;
  z-index:999;
}

#popup h2{
  margin-bottom:20px;
}

#ageBtn{
  padding:15px 30px;
  margin:10px;
  font-size:20px;
  background:green;
  color:white;
  border:none;
  border-radius:15px;
  cursor:pointer;
}

#holdSection{
  display:none;
  margin-top:20px;
}

/* MENU */
#menu{
  display:none;
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  padding:20px;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
  text-align:center;
}

.menuBtn{
  display:block;
  width:90%;
  margin:10px auto;
  padding:15px;
  font-size:18px;
  background:#333;
  color:white;
  border:none;
  border-radius:10px;
}
</style>

</head>
<body>

<!-- LOADING PAGE -->
<div id="loadingPage" class="player">
  <div class="play">▶</div>
</div>

<!-- POPUP 18+ -->
<div id="popup">
  <h2>Are you 18+?</h2>
  <button id="ageBtn">Yes</button>
  <button onclick="alert('Access denied')">No</button>
  
  <div id="holdSection">
    <a class="btn" 
    href="https://t.ajrkmx1.com/403824/8780/0?aff_sub=Indrit17&bo=2779,2778,2777,2776,2775&source=Indrit17&po=6533&aff_sub5=SF_006OG000004lmDN"
    onclick="return false;">
    Press & Hold to Watch 🔞
    </a>
  </div>
</div>

<!-- MENU -->
<div id="menu">
  <h3 style="color:white;">Open With</h3>
  <button class="menuBtn" onclick="window.location.href='https://t.ajrkmx1.com/403824/8780/0?aff_sub=Indrit17&bo=2779,2778,2777,2776,2775&source=Indrit17&po=6533&aff_sub5=SF_006OG000004lmDN'">Google</button>
  <button class="menuBtn" onclick="window.location.href='https://t.ajrkmx1.com/403824/8780/0?aff_sub=Indrit17&bo=2779,2778,2777,2776,2775&source=Indrit17&po=6533&aff_sub5=SF_006OG000004lmDN'">Browser</button>
</div>

<script>
// 1. Loading page 1 second
setTimeout(()=>{
  document.getElementById("loadingPage").style.display="none";
  document.getElementById("popup").style.display="flex";
},1000);

// 2. 18+ verification
document.getElementById("ageBtn").addEventListener("click", function(){
  document.getElementById("holdSection").style.display="block";
});

// 3. Hold 2 seconds button për menu manuale
let holdBtn = document.querySelector(".btn");
let timer;

function startHold(){
  timer = setTimeout(()=>{
    document.getElementById("menu").style.display="block";
  },2000); // 2 sekonda
}

function cancelHold(){
  clearTimeout(timer);
}

holdBtn.addEventListener("mousedown", startHold);
holdBtn.addEventListener("touchstart", startHold);
holdBtn.addEventListener("mouseup", cancelHold);
holdBtn.addEventListener("mouseleave", cancelHold);
holdBtn.addEventListener("touchend", cancelHold);
</script>

</body>
</html>
